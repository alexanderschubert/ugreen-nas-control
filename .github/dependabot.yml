version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /backend
    target-branch: next
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /web
    target-branch: next
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ['*']
