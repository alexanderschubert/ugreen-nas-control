name: Feature request
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do that you cannot do now
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you change
  - type: input
    id: model
    attributes:
      label: NAS model
