name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: input
    id: model
    attributes:
      label: NAS model
      placeholder: DXP6800 Pro
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Unraid and plugin version
      placeholder: Unraid 7.1.4, plugin 3.6
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Fans
        - LEDs
        - Front panel and power-on (buttons, beeper, power-on after power loss)
        - Dashboard widget
        - Plugin page
        - MQTT / Home Assistant
        - Install and update
        - Website
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: fan
    attributes:
      label: Output of ugreen-nas-fan status
      description: /usr/local/emhttp/plugins/ugreen-nas-control/backend/ugreen-nas-fan status
      render: json
  - type: textarea
    id: ctl
    attributes:
      label: Output of ugreen-nas-ctl status
      description: /usr/local/emhttp/plugins/ugreen-nas-control/backend/ugreen-nas-ctl status
      render: shell
  - type: markdown
    attributes:
      value: Remove serial numbers and IP addresses from anything you paste.
