name: Tag release

# The .plg downloads its files from the tag v<version> and the two binaries
# from the release of that tag, each checked against its <MD5>. So the binaries
# are built and checked first, then the tag and the release are made; an
# existing release asset is never replaced.
on:
  push:
    branches: [main]
    paths: [plugin/ugreen-nas-control.plg]
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time; a second push waits instead of racing for the tag.
concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  release:
    # workflow_dispatch can be started on any branch; only main is released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the plugin version
        id: version
        run: |
          version="$(sed -n 's/^<!ENTITY version *"\([^"]*\)">.*/\1/p' plugin/ugreen-nas-control.plg)"
          if [ -z "$version" ]; then
            echo "::error::No version entity found in plugin/ugreen-nas-control.plg"
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: fan/go.mod
          cache: false

      - name: Build ugreen-nas-fan
        working-directory: fan
        run: |
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-s -w" -o ugreen-nas-fan .

      - name: Build ugreen-led-i2c
        working-directory: led/i2c
        run: |
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-s -w" -o ugreen-led-i2c .

      - name: Check the MD5 of every download in the .plg
        run: python3 scripts/plg-hashes.py plugin/ugreen-nas-control.plg --binary ugreen-nas-fan=fan/ugreen-nas-fan --binary ugreen-led-i2c=led/i2c/ugreen-led-i2c --check

      - name: Create the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "UGREEN NAS Control ${TAG#v}"
          git push origin "${TAG}"
          echo "Created ${TAG}."

      - name: Create the release with the binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            for asset in ugreen-nas-fan ugreen-led-i2c; do
              if gh release view "${TAG}" --json assets -q '.assets[].name' | grep -qx "${asset}"; then
                echo "${TAG} already has ${asset}; it stays as it is (installs check its MD5)."
              else
                path="fan/ugreen-nas-fan"; [ "${asset}" = ugreen-led-i2c ] && path="led/i2c/ugreen-led-i2c"
                gh release upload "${TAG}" "${path}"
              fi
            done
          else
            gh release create "${TAG}" fan/ugreen-nas-fan led/i2c/ugreen-led-i2c --title "UGREEN NAS Control ${TAG#v}" --notes "Plugin version ${TAG#v}. Install: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/plugin/ugreen-nas-control.plg"
          fi
